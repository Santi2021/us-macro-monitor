<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Macro Monitor</title>
<meta name="description" content="Monitor de la economía de EE.UU. con datos de BEA, BLS, Fed y Tesoro, actualizado automáticamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: encabezado con período global → pestañas por bloque → resumen (tiles, agenda, lectura) o grilla de tarjetas. */
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #111722;
  --ink-2: #465063;
  --muted: #6f7a8c;
  --grid: #e5e8ee;
  --axis: #c5cbd5;
  --line: rgba(17, 23, 34, 0.10);
  --band: rgba(42, 120, 214, 0.07);
  --hover: rgba(17, 23, 34, 0.04);
  --scrim: rgba(12, 16, 24, 0.55);
  --hoy: #fff4d6;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --ref: #52514e;
  --div-lo: #2a78d6;
  --div-mid: #f0efec;
  --div-hi: #e34948;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1117; --surface: #161b24; --ink: #eef1f6; --ink-2: #b6bfcc; --muted: #8791a2;
    --grid: #252c38; --axis: #353e4c; --line: rgba(255,255,255,0.09); --band: rgba(57,135,229,0.10);
    --hover: rgba(255,255,255,0.05); --scrim: rgba(0,0,0,0.65); --hoy: #3a3220;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --ref: #c3c2b7;
    --div-lo: #3987e5; --div-mid: #383835; --div-hi: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1117; --surface: #161b24; --ink: #eef1f6; --ink-2: #b6bfcc; --muted: #8791a2;
  --grid: #252c38; --axis: #353e4c; --line: rgba(255,255,255,0.09); --band: rgba(57,135,229,0.10);
  --hover: rgba(255,255,255,0.05); --scrim: rgba(0,0,0,0.65); --hoy: #3a3220;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --ref: #c3c2b7;
  --div-lo: #3987e5; --div-mid: #383835; --div-hi: #e66767;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body.bloqueado { overflow: hidden; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 20px 48px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

/* Encabezado */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; padding-block: 8px 18px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.brand p b { color: var(--ink-2); font-weight: 500; }
.brand p .aviso { color: var(--s2); font-weight: 500; }
.periodo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.periodo > span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 13px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:not([aria-pressed="true"]):hover { background: var(--hover); }
.manual[hidden] { display: none; }
.manual { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); width: 100%; justify-content: flex-end; }
.manual label { display: inline-flex; align-items: center; gap: 6px; }
.manual input { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 5px 8px; font-size: 13.5px; }
.manual button { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 6px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }

/* Pestañas */
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: none; padding: 8px 14px; border-radius: 8px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.tabs button:hover { background: var(--hover); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

/* Resumen */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 4px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; display: grid; gap: 3px; min-width: 0; }
.tile .lab { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.tile .val { font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; }
.tile .val small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.tile .del { font-size: 12.5px; color: var(--muted); }
.tile .cmb { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile svg { display: block; width: 100%; height: 34px; margin-top: 4px; }
.pctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pctl i { position: relative; display: block; height: 4px; border-radius: 2px; background: var(--grid); }
.pctl i b { position: absolute; top: -3px; width: 2px; height: 10px; border-radius: 1px; background: var(--ink-2); }

.dupla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; min-width: 0; }
.panel h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel h2 button { border: 0; background: none; color: var(--s1); font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; }
.agenda { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.agenda li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 7px 8px; border-radius: 6px; font-size: 14px; }
.agenda li.hoy { background: var(--hoy); }
.agenda .fch { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 500; }
.agenda .fch small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.agenda .rel { min-width: 0; }
.agenda .rel b { font-weight: 500; }
.agenda .rel span { display: block; color: var(--muted); font-size: 12.5px; }
.vacio-txt { color: var(--muted); font-size: 14px; margin: 4px 0; }

.lectura { margin-top: 16px; }
.lectura ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.lectura li { display: grid; grid-template-columns: 104px 1fr; gap: 12px; font-size: 15px; color: var(--ink); max-width: 115ch; }
.lectura li span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 3px; }
.nota { margin: 12px 0 0; font-size: 13px; color: var(--muted); max-width: 115ch; }

h2.bloque { margin: 28px 0 12px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

/* Tarjetas */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 12px; display: flex; flex-direction: column; min-width: 0; }
.card.ancha { grid-column: 1 / -1; }
.card h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.card .sub { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.card .chart { height: 340px; margin-top: 10px; }
.card.ancha .chart { height: 390px; }
.card.alta .chart { height: 480px; }
.card footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.card footer .meta { display: grid; gap: 1px; min-width: 0; }
.acciones { display: flex; gap: 6px; }
.acciones button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.acciones button:hover { background: var(--hover); }
.acciones svg { width: 13px; height: 13px; }
.tabla { margin-top: 10px; max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.tabla table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.tabla th, .tabla td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
.tabla th:first-child, .tabla td:first-child { text-align: left; }
.tabla thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 500; }

/* Ventana ampliada */
.modal { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: clamp(8px, 3vw, 32px); }
.modal[hidden] { display: none !important; }
.dialogo { background: var(--surface); border-radius: 12px; width: min(1400px, 100%); max-height: 100%; display: flex; flex-direction: column; padding: 20px 22px 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); min-width: 0; }
.dialogo header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.dialogo h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.dialogo .sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.dialogo .chart { height: min(68vh, 720px); margin-top: 12px; }
.dialogo footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.cerrar { border: 1px solid var(--line); background: none; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; flex: none; display: grid; place-items: center; }
.cerrar:hover { background: var(--hover); }

/* Calendario */
.cal { display: grid; gap: 16px; margin-top: 4px; }
.semana { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; }
.semana h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.semana .agenda li { grid-template-columns: 120px 1fr; }
.semana .agenda li.pasado { opacity: 0.6; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
.chips span { font-size: 12px; color: var(--ink-2); background: var(--hover); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.clave { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--s2); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 8px; vertical-align: 1px; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; border-radius: 4px; padding: 0 6px; margin-left: 6px; background: var(--ink); color: var(--surface); vertical-align: 1px; }

.estado { margin-top: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; max-width: 640px; }
.estado h2 { margin: 0 0 8px; font-size: 18px; }
.estado p { margin: 0; color: var(--ink-2); }

.pie { margin-top: 36px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .grid, .dupla { grid-template-columns: minmax(0, 1fr); }
  .card .chart { height: 310px; }
  .card.alta .chart { height: 520px; }
}
@media (max-width: 560px) {
  .brand h1 { font-size: 22px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { padding: 12px; }
  .tile .val { font-size: 23px; }
  .lectura li, .agenda li, .semana .agenda li { grid-template-columns: 1fr; gap: 2px; }
  .card { padding: 14px 12px 10px; }
  .card h3 { font-size: 16px; }
  .dialogo { padding: 14px 12px 10px; }
  .dialogo h2 { font-size: 17px; }
  .periodo, .manual { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>US Macro Monitor</h1>
      <p id="meta">Cargando datos…</p>
    </div>
    <div class="periodo">
      <span id="lbl-periodo">Período</span>
      <div class="seg" role="group" aria-labelledby="lbl-periodo" id="rango">
        <button type="button" id="r-2022" data-r="2022" aria-pressed="true">Desde 2022</button>
        <button type="button" id="r-5" data-r="5" aria-pressed="false">5 años</button>
        <button type="button" id="r-10" data-r="10" aria-pressed="false">10 años</button>
        <button type="button" id="r-2000" data-r="2000" aria-pressed="false">Desde 2000</button>
        <button type="button" id="r-manual" data-r="manual" aria-pressed="false" aria-expanded="false">Elegir fechas</button>
      </div>
      <form class="manual" id="manual" hidden>
        <label>Desde <input type="month" id="m-desde" min="2000-01" required></label>
        <label>Hasta <input type="month" id="m-hasta" min="2000-01" required></label>
        <button type="submit" id="m-aplicar">Aplicar</button>
      </form>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Bloques" id="tabs"></nav>
  <main id="main"></main>
  <footer class="pie">
    <span>Fuentes: BEA, BLS, Census, Fed, Tesoro y U. de Michigan, vía sus APIs y FRED. Se actualiza solo los días hábiles, después de cada release.</span>
    <span>@SantiGonzalezAR</span>
  </footer>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="dialogo">
    <header>
      <div>
        <h2 id="modal-titulo"></h2>
        <p class="sub" id="modal-sub"></p>
      </div>
      <button type="button" class="cerrar" id="modal-cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>
    <div class="chart" id="modal-chart"></div>
    <footer>
      <span id="modal-meta"></span>
      <div class="acciones"><button type="button" id="modal-png"></button></div>
    </footer>
  </div>
</div>

<script src="vendor/echarts-5.5.1.min.js"></script>
<script>
"use strict";
// ─────────────────────────── estado y utilidades ───────────────────────────
const SECC = [
  ["resumen", "Resumen"], ["actividad", "Actividad"], ["consumidor", "Consumidor"], ["precios", "Precios"],
  ["empleo", "Empleo"], ["tasas", "Tasas"], ["externo", "Externo y fiscal"], ["calendario", "Calendario"],
];
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIA = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const EVENTOS = [["2008-09-15", "Lehman"], ["2020-03-01", "COVID"], ["2022-03-16", "Fed sube"], ["2024-09-18", "Fed baja"]];
// Ventana en la que la pandemia distorsiona las series (incluye el rebote de transferencias y precios hasta mediados de 2022)
const COVID = [Date.UTC(2020, 2, 1), Date.UTC(2022, 5, 1)];
// El recorte sólo se activa si el período incluye el shock en sí (2020 y el primer semestre de 2021)
const COVID_SHOCK = [Date.UTC(2020, 2, 1), Date.UTC(2021, 5, 1)];
const ICONOS = {
  ampliar: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  png: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
// Nombres en castellano de los releases de FRED (los que no están, se muestran en inglés)
const RELEASES_ES = {
  "Personal Income and Outlays": "Ingresos y gastos personales (BEA)",
  "Gross Domestic Product": "PBI (BEA)",
  "Employment Situation": "Informe de empleo (BLS)",
  "Consumer Price Index": "CPI (BLS)",
  "Job Openings and Labor Turnover Survey": "JOLTS (BLS)",
  "Unemployment Insurance Weekly Claims Report": "Pedidos de desempleo (Dpto. de Trabajo)",
  "G.17 Industrial Production and Capacity Utilization": "Producción industrial (Fed)",
  "Advance Monthly Sales for Retail and Food Services": "Ventas minoristas (Census)",
  "Surveys of Consumers": "Encuesta de consumidores (U. de Michigan)",
  "U.S. International Trade in Goods and Services": "Comercio exterior (BEA y Census)",
  "Manufacturers' Shipments, Inventories, and Orders": "Órdenes de la industria (Census)",
  "Advance Report on Durable Goods Manufacturers' Shipments, Inventories and Orders": "Bienes durables (Census)",
  "New Residential Construction": "Construcción de viviendas (Census)",
  "Monthly Treasury Statement": "Resultado fiscal mensual (Tesoro)",
  "GDPNow": "GDPNow (Fed de Atlanta)",
  "Real-time Sahm Rule Recession Indicator": "Regla de Sahm (Fed de St. Louis)",
  "Primary Mortgage Market Survey": "Tasa hipotecaria (Freddie Mac)",
  "Federal Debt: Total Public Debt as Percent of Gross Domestic Product": "Deuda pública / PBI",
  "H.15 Selected Interest Rates": "Tasas de interés H.15 (Fed)",
  "H.10 Foreign Exchange Rates": "Tipos de cambio H.10 (Fed)",
  "Interest Rate Spreads": "Spreads de tasas (Fed de St. Louis)",
  "Treasury Inflation-Indexed Securities": "Bonos indexados TIPS (Tesoro)",
  "Daily Treasury Par Yield Curve Rates": "Curva del Tesoro (Tesoro)",
  "Treasury Term Premia": "Prima por plazo (Fed)",
  "Manufacturer's Shipments, Inventories, and Orders (M3) Survey": "Órdenes de la industria (Census)",
  "Debt to Gross Domestic Product Ratios": "Deuda pública / PBI (Tesoro)",
  "Sahm Rule Recession Indicator": "Regla de Sahm (Fed de St. Louis)",
  "An Arbitrage-Free Three-Factor Term Structure Model and the Recent Behavior of Long-Term Yields and Distant-Horizon Forward Rates": "Prima por plazo (Fed)",
};
// Releases que mueven el mercado: se destacan en la agenda
const CLAVE = /Employment Situation|Consumer Price Index|Personal Income and Outlays|Gross Domestic Product|Advance Monthly Sales for Retail|Job Openings/;
// Releases de mercado o de alta frecuencia que no van en la agenda (se actualizan solos todo el tiempo)
const FUERA_DE_AGENDA = /H\.10|Primary Mortgage|Arbitrage-Free|H\.15|Interest Rate Spreads|GDPNow/;

let DATA = null, SEC = "resumen";
let RANGO = { modo: "2022", desde: null, hasta: null };
const CHARTS = [];
let MODAL = null;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const nf = (v, d = 1) => v == null || !isFinite(v) ? "–" :
  v.toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const sg = (v, d = 1) => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : "") + nf(v, d);
const fm = t => { const d = new Date(t); return MES[d.getUTCMonth()] + "-" + String(d.getUTCFullYear()).slice(2); };
const fq = t => { const d = new Date(t); return "Q" + (Math.floor(d.getUTCMonth() / 3) + 1) + "-" + String(d.getUTCFullYear()).slice(2); };
const fd = t => { const d = new Date(t); return `${DIA[d.getUTCDay()]} ${String(d.getUTCDate()).padStart(2, "0")}-${MES[d.getUTCMonth()]}`; };
const T = (y, m = 1) => Date.UTC(y, m - 1, 1);
const P = s => Date.parse(s + "T00:00:00Z");
const hoyUTC = () => { const h = new Date(); return Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Límites del período elegido
let T0 = T(2022), T1 = Infinity, ULT = Infinity;
function calcularRango() {
  const d = new Date(ULT === Infinity ? Date.now() : ULT);
  const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1;
  T1 = Infinity;
  if (RANGO.modo === "2022") T0 = T(2022);
  else if (RANGO.modo === "2000") T0 = T(2000);
  else if (RANGO.modo === "manual" && RANGO.desde) {
    const [y0, m0] = RANGO.desde.split("-").map(Number), [y1, m1] = RANGO.hasta.split("-").map(Number);
    T0 = T(y0, m0);
    const fin = T(y1, m1);
    T1 = fin >= T(y, m) ? Infinity : Date.UTC(y1, m1, 0);   // hasta el último día del mes elegido

}

// Serie con datos hasta el fin del período (si el período termina antes de hoy, todo se calcula "a esa fecha")
function S(k) {
  const s = DATA && DATA.series[k];
  if (!s) return null;
  const a = s.d.map(([d, v]) => [P(d), v]).filter(p => p[0] <= T1);
  return a.length ? a : null;
}
const last = a => a && a.length ? a[a.length - 1] : null;
const prev = (a, n = 1) => a && a.length > n ? a[a.length - 1 - n] : null;
function lagged(a, k, fn) {
  if (!a) return null;

}
const yoy = (a, k = 12) => lagged(a, k, (x, y) => (x / y - 1) * 100);
const ann = (a, k, per = 12) => lagged(a, k, (x, y) => (Math.pow(x / y, per / k) - 1) * 100);
const diff = (a, k = 1) => lagged(a, k, (x, y) => x - y);
function roll(a, w, suma = false) {
  if (!a || a.length < w) return null;
  const out = [];
  for (let i = w - 1; i < a.length; i++) {
    let s = 0; for (let j = i - w + 1; j <= i; j++) s += a[j][1];
    out.push([a[i][0], suma ? s : s / w]);
  }
  return out;
}
function join(a, b, fn) {
  if (!a || !b) return null;
  const m = new Map(b); const r = a.filter(p => m.has(p[0])).map(p => [p[0], fn(p[1], m.get(p[0]))]);
  return r.length ? r : null;
}
// Une una serie mensual con una trimestral: a cada mes le toca el valor de su trimestre
function joinQ(m, q, fn) {
  if (!m || !q) return null;
  const mq = new Map(q);
  const r = m.map(([t, v]) => { const d = new Date(t); const k = Date.UTC(d.getUTCFullYear(), Math.floor(d.getUTCMonth() / 3) * 3, 1); return mq.has(k) ? [t, fn(v, mq.get(k))] : null; }).filter(Boolean);
  return r.length ? r : null;
}
function toQ(a, modo = "avg") {
  if (!a) return null;
  const g = new Map();
  for (const [t, v] of a) {
    const d = new Date(t), k = Date.UTC(d.getUTCFullYear(), Math.floor(d.getUTCMonth() / 3) * 3, 1);
    if (!g.has(k)) g.set(k, []); g.get(k).push(v);
  }
  return [...g].filter(([, v]) => v.length === 3)
    .map(([k, v]) => [k, modo === "sum" ? v.reduce((x, y) => x + y, 0) : v.reduce((x, y) => x + y, 0) / 3]);
}
function idx(a) {
  if (!a) return null;
  const b = a.filter(p => p[0] >= T0); if (!b.length) return null;
  return b.map(p => [p[0], p[1] / b[0][1] * 100]);
}
// Indexa varias series a 100 en la primera fecha que tienen todas en común dentro del período
function idxComun(...as) {
  if (as.some(a => !a || !a.length)) return as.map(() => null);
  const inicio = Math.max(T0, ...as.map(a => a[0][0]));
  return as.map(a => {
    const b = a.filter(p => p[0] >= inicio); if (!b.length) return null;
    return b.map(p => [p[0], p[1] / b[0][1] * 100]);
  });
}
const cut = (a, desde = T0) => a ? a.filter(p => p[0] >= desde) : null;
function rangoNormal(a) {
  if (!a) return null;
  const r = a.filter(p => p[0] >= T(2000) && p[0] < T(2020)).map(p => p[1]).sort((x, y) => x - y);
  if (r.length < 12) return null;
  const q = f => r[Math.round(f * (r.length - 1))];
  return [q(0.1), q(0.9)];
}
function pctl(a, v) {
  const r = a.filter(p => p[0] >= T(2000)).map(p => p[1]);
  return r.length ? Math.round(r.filter(x => x <= v).length / r.length * 100) : null;
}
function fuente(...ks) {
  const f = new Set(ks.map(k => {
    const s = DATA.series[k]; if (!s) return null;
    return s.org ? s.org + (s.src === "FRED" ? " vía FRED" : "") : s.src;
  }).filter(Boolean));
  return [...f].join(" · ");
}
const nombreRelease = n => RELEASES_ES[n] || n;

// Releases diarios (tasas, dólar): no se muestran en la agenda porque salen todos los días
function releasesDiarios() {
  const c = new Map();
  for (const e of DATA.calendario || []) c.set(e.rid, (c.get(e.rid) || 0) + 1);
  const nombres = new Map((DATA.calendario || []).map(e => [e.rid, e.nombre]));
  return new Set([...c].filter(([r, n]) => n > 25 || FUERA_DE_AGENDA.test(nombres.get(r) || "")).map(([r]) => r));
}
let DIARIOS = new Set();
function proximoRelease(ks) {
  const hoy = hoyUTC();
  const rids = new Set(ks.map(k => DATA.series[k] && DATA.series[k].rel).filter(Boolean));
  if (!rids.size) return null;
  if ([...rids].every(r => DIARIOS.has(r))) return { diario: true };
  const g = new Date(DATA.generado), hoyYaSalio = Date.UTC(g.getUTCFullYear(), g.getUTCMonth(), g.getUTCDate()) === hoy && g.getUTCHours() >= 13;
  const e = (DATA.calendario || []).filter(c => rids.has(c.rid) && !DIARIOS.has(c.rid) && (P(c.fecha) > hoy || (P(c.fecha) === hoy && !hoyYaSalio)))
    .sort((a, b) => a.fecha.localeCompare(b.fecha))[0];
  return e ? { fecha: P(e.fecha), nombre: nombreRelease(e.nombre) } : null;
}

// ─────────────────────────── construcción de gráficos ───────────────────────────
function paleta() { return [css("--s1"), css("--s2"), css("--s3"), css("--s4")]; }

// Cantidad de renglones que ocupa la leyenda en un ancho dado (para reservarle lugar y que no pise el gráfico)
function renglonesLeyenda(nombres, ancho) {
  let lin = 1, x = 0;
  for (const n of nombres) {
    const w = n.length * 7.3 + 34;
    if (x + w > ancho && x > 0) { lin++; x = 0; }
    x += w;
  }
  return lin;
}

// Si el período incluye la pandemia y sus extremos aplastan la escala, se recorta el eje y se avisa
function redondo(v, paso, arriba) { return (arriba ? Math.ceil(v / paso) : Math.floor(v / paso)) * paso; }
function pasoLindo(r) { const e = Math.pow(10, Math.floor(Math.log10(r))); const f = r / e; return (f <= 2 ? 0.25 : f <= 5 ? 0.5 : 1) * e; }
function recorteCovid(sp) {
  if (sp.tipo || sp.yMin != null || sp.yMax != null || sp.sinRecorte) return;
  const pts = sp.series.flatMap(s => s.d);
  if (!pts.some(p => p[0] >= COVID_SHOCK[0] && p[0] <= COVID_SHOCK[1])) return;
  const fuera = pts.filter(p => p[0] < COVID[0] || p[0] > COVID[1]).map(p => p[1]);
  if (fuera.length < 6) return;
  const todos = pts.map(p => p[1]);
  const lo = Math.min(...fuera), hi = Math.max(...fuera), r = hi - lo || 1;
  const mn = Math.min(...todos), mx = Math.max(...todos);
  if (mx - hi > 0.4 * r || lo - mn > 0.4 * r) {
    const paso = pasoLindo(r * 1.25);
    if (mn < lo - 0.4 * r) sp.yMin = redondo(lo - 0.08 * r, paso, false);
    if (mx > hi + 0.4 * r) sp.yMax = redondo(hi + 0.08 * r, paso, true);
    sp.recortado = true;
  }
}

          <span>${p.marker}${esc(p.seriesName)}</span><b style="font-variant-numeric:tabular-nums">${nf(p.value[1], dec)}${u === "%" ? "%" : u ? " " + u : ""}</b></div>`;

G.colchon = () => {

  const base = b.reduce((x, y) => x + y, 0) / b.length;
  const flujo = join(sr, dpi, (s, d) => (s - base) / 100 * d / 12).filter(x => x[0] >= T(2020));

  const ritmo = flujo.slice(-3).reduce((x, y) => x + y[1], 0) / 3, hoy = last(stock)[1];

  return { ks: ["saving_rate"], titulo, sub: `Ahorro acumulado desde 2020 por encima de la tasa normal 2015-19 (${nf(base)}%), en miles de millones de US$. Ritmo de los últimos 3 meses: ${sg(ritmo, 0)} por mes. Meses = stock ÷ ritmo.`,

  const ss = ks.map(([k, n], i) => ({ n, d: cut(S(k)), c: i })).filter(s => s.d && s.d.length);
  if (ss.length < 3) return null;
  return { ks: ["ust10", "fed_funds"], titulo: `Fed ${nf(last(ss[0].d)[1], 2)}%, 2 años ${nf(last(ss[1].d)[1], 2)}%, 10 años ${nf(last(ss[2].d)[1], 2)}%`,
    sub: "Promedios mensuales, en %.", fuente: "Fed y Tesoro de EE.UU. vía FRED", dec: 2, series: ss };
};
G.pendiente = () => {
  const a = S("ust10"), b = S("ust2"), c = S("spread_10y3m"); if (!a || !b) return null;
  const s = join(a, b, (x, y) => (x - y) * 100), v = last(s)[1];
  const ss = [{ n: "10 años − 2 años", d: cut(s), c: 0 }];
  if (c) ss.push({ n: "10 años − 3 meses", d: cut(c).map(p => [p[0], p[1] * 100]), c: 1 });
  return { ks: ["ust10"], titulo: v >= 0 ? `Curva 10-2 positiva en ${nf(v, 0)} pb` : `Curva 10-2 invertida en ${nf(-v, 0)} pb`,
    sub: "Pendiente de la curva, en puntos básicos. La inversión 10-3 meses precedió a las últimas recesiones; el riesgo suele aparecer cuando vuelve a positiva.",
    fuente: "Tesoro de EE.UU. vía FRED", unidad: "pb", dec: 0, series: ss, refs: [{ y: 0 }] };
};
G.tasaReal = () => {
  const r = S("tips10"), be = S("breakeven10"); if (!r || !be) return null;
  const v = last(r)[1];
  return { ks: ["tips10"], titulo: `Tasa real a 10 años en ${nf(v, 2)}%: percentil ${pctl(r, v)} desde 2003`,
    sub: "El rendimiento nominal a 10 años se divide en tasa real (TIPS) e inflación esperada (breakeven).", fuente: "Tesoro de EE.UU. vía FRED", dec: 2,
    series: [{ n: "Tasa real (TIPS 10a)", d: cut(r), c: 0, w: 2.8 }, { n: "Inflación esperada (breakeven 10a)", d: cut(be), c: 1 }], refs: [{ y: 0 }] };
};
G.primaPlazo = () => {

  return { ks: ["term_premium"], titulo: `La prima por plazo a 10 años está en ${nf(v, 2)}%: percentil ${pctl(t, v)} desde 2000`,
    sub: "Compensación extra que exige el inversor por prestar a 10 años en vez de renovar a corto plazo (modelo Kim-Wright de la Fed). Sube con el riesgo fiscal y la incertidumbre de inflación.",
    fuente: fuente("term_premium"), dec: 2, banda: rangoNormal(t), series: [{ n: "Prima por plazo 10 años", d: cut(t), c: 0 }], refs: [{ y: 0 }] };

G.hipotecaria = () => {

G.politica = () => {

G.nominalTasa = () => {

// ─────────────────────────── tarjetas ───────────────────────────
function limpiar() { while (CHARTS.length) CHARTS.pop().dispose(); }

function frescura(sp) {
  const k = (sp.ks || []).find(k => DATA.series[k]);
  if (!k) return "";
  const s = S(k), f = DATA.series[k].f;
  const u = s ? last(s)[0] : null;
  let txt = u ? `Último dato: ${f === "Q" ? fq(u) : fm(u)}` : "";
  const pr = T1 === Infinity ? proximoRelease(sp.ks) : null;
  if (pr && pr.diario) txt += " · dato de alta frecuencia";
  else if (pr) txt += ` · próximo: ${fd(pr.fecha)}`;
  return txt;
}

function tarjeta(id, clase) {
  let sp = null;
  try { sp = G[id](); } catch (e) { console.error(id, e); }
  const el = document.createElement("article");
  el.className = "card " + (clase || "");
  if (!sp) {
    el.innerHTML = `<h3>Serie no disponible</h3><p class="sub">Falta alguna de las series de este gráfico en el período elegido o en la última actualización.</p>`;
    return el;
  }
  if (sp.fijo) sp.series.forEach(s => { if (Array.isArray(s.d) && s.d.length && Array.isArray(s.d[0])) s.d = s.d.filter(p => p[0] >= sp.fijo); });
  recorteCovid(sp);
  if (sp.recortado) sp.sub += " Eje recortado en la pandemia para no aplastar la escala.";
  el.innerHTML = `<h3></h3><p class="sub"></p><div class="chart" role="img"></div>
    <footer><div class="meta"><span class="fte"></span><span class="frs"></span></div>
    <div class="acciones">
      <button type="button" class="b-tabla" aria-expanded="false">Tabla</button>
      <button type="button" class="b-png">${ICONOS.png}PNG</button>
      <button type="button" class="b-ampliar">${ICONOS.ampliar}Ampliar</button>
    </div></footer><div class="tabla" hidden></div>`;
  el.querySelector("h3").textContent = sp.titulo;
  el.querySelector(".sub").textContent = sp.sub;
  el.querySelector(".chart").setAttribute("aria-label", sp.titulo);
  el.querySelector(".fte").textContent = "Fuente: " + (sp.fuente || "");
  el.querySelector(".frs").textContent = frescura(sp);
  const btn = el.querySelector(".b-tabla"), tb = el.querySelector(".tabla");
  btn.addEventListener("click", () => {
    const abrir = tb.hidden; tb.hidden = !abrir; btn.setAttribute("aria-expanded", String(abrir));
    btn.textContent = abrir ? "Ocultar tabla" : "Tabla";
    if (abrir && !tb.firstChild) tb.appendChild(tablaDe(sp));
  });
  el.querySelector(".b-ampliar").addEventListener("click", () => abrirModal(sp, id));
  el.querySelector(".b-png").addEventListener("click", () => bajarPNG(sp, el._chart, id));
  el._sp = sp;
  return el;
}

function tablaDe(sp) {
  const t = document.createElement("table");
  let cab, filas;
  if (sp.tabla) { cab = sp.tabla.cab; filas = sp.tabla.filas; }
  else if (sp.tipo === "cat") {
    cab = ["", ...sp.series.map(s => s.n)];
    filas = sp.cats.map((c, i) => [c, ...sp.series.map(s => nf(s.d[i], sp.dec ?? 1))]);
    if (sp.freq === "Q") filas.reverse();
  } else {
    const fx = sp.freq === "Q" ? fq : fm, dec = sp.dec ?? 1;
    const ts = [...new Set(sp.series.flatMap(s => s.d.map(p => p[0])))].sort((a, b) => b - a).slice(0, 48);
    const ms = sp.series.map(s => new Map(s.d));
    cab = [sp.freq === "Q" ? "Trimestre" : "Mes", ...sp.series.map(s => s.n)];
    filas = ts.map(t => [fx(t), ...ms.map(m => nf(m.get(t), dec))]);
  }
  t.innerHTML = "<thead><tr>" + cab.map(c => `<th scope="col">${esc(c)}</th>`).join("") + "</tr></thead><tbody>" +
    filas.map(f => "<tr>" + f.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>").join("") + "</tbody>";
  return t;
}

function dibujar(el) {
  const sp = el._sp; if (!sp) return;
  const box = el.querySelector(".chart");
  const ch = echarts.init(box, null, { renderer: "canvas" });
  ch.setOption(opciones(sp, box.clientWidth, false));
  el._chart = ch;
  CHARTS.push(ch);
}

function abrirModal(sp, id) {
  const m = document.getElementById("modal");
  document.getElementById("modal-titulo").textContent = sp.titulo;
  document.getElementById("modal-sub").textContent = sp.sub;
  document.getElementById("modal-meta").textContent = "Fuente: " + (sp.fuente || "") + " · " + frescura(sp);
  const png = document.getElementById("modal-png");
  png.innerHTML = ICONOS.png + "Bajar PNG";
  m.hidden = false;
  document.body.classList.add("bloqueado");
  const box = document.getElementById("modal-chart");
  if (MODAL) MODAL.dispose();
  MODAL = echarts.init(box, null, { renderer: "canvas" });
  MODAL.setOption(opciones(sp, box.clientWidth, true));
  png.onclick = () => bajarPNG(sp, MODAL, id);
  document.getElementById("modal-cerrar").focus();
}
function cerrarModal() {
  const m = document.getElementById("modal");
  if (m.hidden) return;
  m.hidden = true;
  document.body.classList.remove("bloqueado");
  if (MODAL) { MODAL.dispose(); MODAL = null; }
}
document.getElementById("modal-cerrar").addEventListener("click", cerrarModal);
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") cerrarModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

// Arma una imagen con título, subtítulo, gráfico, fuente y firma, lista para publicar
function envolverTexto(ctx, texto, ancho) {
  const pal = texto.split(" "), lin = []; let l = "";
  for (const p of pal) { const t = l ? l + " " + p : p; if (ctx.measureText(t).width > ancho && l) { lin.push(l); l = p; } else l = t; }
  if (l) lin.push(l);
  return lin;
}
function bajarPNG(sp, chart, id) {
  if (!chart) return;
  const esc2 = 2, pad = 28 * esc2;
  const img = new Image();
  img.onload = () => {
    const W = img.width + pad * 2;
    const c = document.createElement("canvas"), ctx = c.getContext("2d");
    const fuenteF = css("--font");
    ctx.font = `600 ${22 * esc2}px ${fuenteF}`;
    const lt = envolverTexto(ctx, sp.titulo, W - pad * 2);
    ctx.font = `400 ${14 * esc2}px ${fuenteF}`;
    const ls = envolverTexto(ctx, sp.sub, W - pad * 2);
    const hT = lt.length * 30 * esc2, hS = ls.length * 20 * esc2;
    const H = pad + hT + 6 * esc2 + hS + 14 * esc2 + img.height + 16 * esc2 + 18 * esc2 + pad * 0.8;
    c.width = W; c.height = H;
    ctx.fillStyle = css("--surface"); ctx.fillRect(0, 0, W, H);
    let y = pad;
    ctx.textBaseline = "top";
    ctx.fillStyle = css("--ink"); ctx.font = `600 ${22 * esc2}px ${fuenteF}`;
    for (const l of lt) { ctx.fillText(l, pad, y); y += 30 * esc2; }
    y += 6 * esc2;
    ctx.fillStyle = css("--muted"); ctx.font = `400 ${14 * esc2}px ${fuenteF}`;
    for (const l of ls) { ctx.fillText(l, pad, y); y += 20 * esc2; }
    y += 14 * esc2;
    ctx.drawImage(img, pad, y); y += img.height + 16 * esc2;
    ctx.fillStyle = css("--muted"); ctx.font = `400 ${12.5 * esc2}px ${fuenteF}`;
    ctx.fillText("Fuente: " + (sp.fuente || ""), pad, y);
    ctx.fillStyle = css("--ink"); ctx.font = `600 ${13 * esc2}px ${fuenteF}`;
    const firma = "@SantiGonzalezAR";
    ctx.fillText(firma, W - pad - ctx.measureText(firma).width, y);
    const a = document.createElement("a");
    a.download = `us-macro-monitor-${id}-${new Date().toISOString().slice(0, 10)}.png`;
    a.href = c.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  };
  img.src = chart.getDataURL({ type: "png", pixelRatio: esc2, backgroundColor: css("--surface") });
}

// ─────────────────────────── resumen ───────────────────────────
function sparkline(a) {
  if (!a || a.length < 2) return "";
  const v = a.map(p => p[1]), mn = Math.min(...v), mx = Math.max(...v), W = 200, H = 34, pad = 3;
  const x = i => i / (v.length - 1) * W, y = t => H - pad - (mx === mn ? 0.5 : (t - mn) / (mx - mn)) * (H - 2 * pad);
  const d = v.map((t, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(t).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${W} ${H} L0 ${H}Z" fill="var(--s1)" opacity=".08"/>
    <path d="${d}" fill="none" stroke="var(--s1)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(v.length - 1)}" cy="${y(v[v.length - 1])}" r="2.6" fill="var(--s1)"/></svg>`;
}

function tiles() {
  const pay = S("payrolls"), payD = pay && roll(diff(pay), 3);
  const curva = join(S("ust10"), S("ust2"), (a, b) => (a - b) * 100);
  const L = [
    ["PBI real", S("gdp_growth"), "%", 1, "t/t anualizado", "Q"],
    ["GDPNow", S("gdpnow"), "%", 1, "estimación Fed Atlanta", "Q"],
    ["Core PCE", yoy(S("pce_core")), "%", 1, "interanual"],
    ["CPI core", yoy(S("cpi_core")), "%", 1, "interanual"],
    ["Desempleo", S("unemployment"), "%", 1, "de la fuerza laboral"],
    ["Nóminas", payD, "mil", 0, "por mes, prom. 3m"],
    ["Regla de Sahm", S("sahm"), "pp", 2, "umbral de recesión 0,5"],
    ["Tasa de ahorro", S("saving_rate"), "%", 1, "del ingreso disponible"],
    ["Fondos federales", S("fed_funds"), "%", 2, "promedio mensual"],
    ["Treasury 10 años", S("ust10"), "%", 2, "promedio mensual"],
    ["Tasa real 10 años", S("tips10"), "%", 2, "TIPS"],
    ["Curva 10-2", curva, "pb", 0, "puntos básicos"],
  ];
  const box = document.createElement("div"); box.className = "tiles";
  for (const [lab, a, u, d, nota, f] of L) {
    if (!a || !a.length) continue;
    const [t, v] = last(a), pv = prev(a), p = pctl(a, v);
    const el = document.createElement("div"); el.className = "tile";
    const cambio = pv ? v - pv[1] : null;
    el.innerHTML = `<div class="lab">${lab}</div>
      <div class="val">${nf(v, d)}<small>${u}</small></div>
      <div class="del">${f === "Q" ? fq(t) : fm(t)} · ${nota}</div>
      <div class="cmb">${cambio != null ? `${cambio > 0 ? "▲" : cambio < 0 ? "▼" : "="} ${nf(Math.abs(cambio), d)} vs. ${f === "Q" ? "trim." : "mes"} anterior` : ""}</div>
      ${sparkline(a.slice(f === "Q" ? -16 : -36))}
      <div class="pctl" title="Posición del último dato dentro de la historia desde 2000"><i><b style="left:calc(${p}% - 1px)"></b></i><span>p${p} desde 2000</span></div>`;
    box.appendChild(el);
  }
  return box;
}

function eventosAgenda(desde, hasta) {
  return (DATA.calendario || []).filter(c => !DIARIOS.has(c.rid) && P(c.fecha) >= desde && P(c.fecha) <= hasta)
    .sort((a, b) => a.fecha.localeCompare(b.fecha) || a.nombre.localeCompare(b.nombre));
}
function itemAgenda(c, hoy) {
  const t = P(c.fecha);
  const dias = Math.round((t - hoy) / 864e5);
  const cuando = dias === 0 ? "Hoy" : dias === 1 ? "Mañana" : dias === -1 ? "Ayer" : dias > 0 ? `en ${dias} días` : `hace ${-dias} días`;
  const series = c.series.map(k => DATA.series[k] && DATA.series[k].n).filter(Boolean);
  return `<li class="${dias === 0 ? "hoy" : ""}${dias < 0 ? " pasado" : ""}"><div class="fch">${fd(t)}<small>${cuando}</small></div>
    <div class="rel"><b>${esc(nombreRelease(c.nombre))}</b>${CLAVE.test(c.nombre) ? '<span class="clave" style="display:inline-block">Clave</span>' : ""}${series.length ? `<span>${esc(series.slice(0, 4).join(" · "))}${series.length > 4 ? ` y ${series.length - 4} más` : ""}</span>` : ""}</div></li>`;
}

function agendaResumen() {
  const hoy = hoyUTC();
  const prox = eventosAgenda(hoy, hoy + 21 * 864e5).slice(0, 7);
  const nov = (DATA.novedades || []).filter(n => n.tipo === "nuevo" && DATA.series[n.k]).slice().reverse();
  const vistas = new Set(), recientes = [];
  for (const n of nov) {
    const nombre = DATA.series[n.k].n;
    if (vistas.has(nombre) || n.k.startsWith("cat:")) continue;
    vistas.add(nombre); recientes.push(n);
    if (recientes.length >= 7) break;
  }
  const el = document.createElement("div"); el.className = "dupla";
  el.innerHTML = `<section class="panel"><h2>Próximos datos <button type="button" id="ir-cal">Ver calendario</button></h2>
      ${prox.length ? `<ul class="agenda">${prox.map(c => itemAgenda(c, hoy)).join("")}</ul>` : `<p class="vacio-txt">El calendario se completa con la próxima actualización automática.</p>`}</section>
    <section class="panel"><h2>Últimos datos que entraron</h2>
      ${recientes.length ? `<ul class="agenda">${recientes.map(n => {
        const s = DATA.series[n.k], t = P(n.det.slice(0, 10));
        return `<li><div class="fch">${fd(t)}<small>detectado</small></div><div class="rel"><b>${esc(s.n)}</b><span>dato de ${s.f === "Q" ? fq(P(n.obs)) : fm(P(n.obs))}${n.tipo === "revisión" ? " (revisión)" : ""}</span></div></li>`;
      }).join("")}</ul>` : `<p class="vacio-txt">Todavía no hay novedades registradas: se anotan desde la segunda actualización automática, cada vez que una serie suma un dato.</p>`}</section>`;
  el.querySelector("#ir-cal").addEventListener("click", () => irA("calendario"));
  return el;
}

function lectura() {
  const items = [];
  const intento = (f) => { try { const r = f(); if (r) items.push(r); } catch (e) {} };
  intento(() => {
    const g = S("gdp_growth"), n = S("gdpnow"), ks = [["c_consumo", "el consumo"], ["c_inversion", "la inversión"], ["c_gobierno", "el gasto público"], ["c_externo", "el sector externo"]];
    const m = ks.map(([k, nm]) => [nm, last(S(k))[1]]).sort((a, b) => b[1] - a[1])[0];
    let t = `El PBI creció ${nf(last(g)[1])}% anualizado en ${fq(last(g)[0])}; lo que más aportó fue ${m[0]} (${sg(m[1])} pp).`;
    if (n && last(n)[0] > last(g)[0]) t += ` Para ${fq(last(n)[0])}, GDPNow estima ${nf(last(n)[1])}%.`;
    return ["Actividad", t];
  });
  intento(() => {
    const c = yoy(S("pce_real")), i = yoy(S("dpi_real")), s = last(S("saving_rate"))[1];
    return ["Consumidor", `El consumo real crece ${nf(last(c)[1])}% interanual contra ${nf(last(i)[1])}% del ingreso disponible real. La tasa de ahorro está en ${nf(s)}%.`];
  });
  intento(() => {
    const c = S("pce_core"), y = last(yoy(c))[1], m3 = last(ann(c, 3))[1];
    const rs = rubros(), cal = rs.filter(r => last(r.a3)[1] > 3).length;
    const e = S("infl_exp_5y5y");
    return ["Precios", `El core PCE corre a ${nf(y)}% interanual y ${nf(m3)}% anualizado a 3 meses` + (rs.length ? `; ${cal} de ${rs.length} rubros superan 3%` : "") + (e ? `. El mercado espera ${nf(last(e)[1], 2)}% a largo plazo.` : ".")];
  });
  intento(() => {
    const p = roll(diff(S("payrolls")), 3), u = last(S("unemployment"))[1], sh = S("sahm");
    return ["Empleo", `La economía suma ${nf(last(p)[1], 0)} mil puestos por mes en promedio de 3 meses, con desempleo en ${nf(u)}%` + (sh ? ` y la regla de Sahm en ${nf(last(sh)[1], 2)} pp (umbral 0,5).` : ".")];
  });
  intento(() => {
    const r = S("tips10"), v = last(r)[1], f = last(S("fed_funds"))[1], c = last(yoy(S("pce_core")))[1];
    return ["Tasas", `La tasa real a 10 años está en ${nf(v, 2)}% (percentil ${pctl(r, v)} desde 2003) y la tasa real de la Fed en ${nf(f - c)}%.`];
  });
  intento(() => {
    const d = G.deficit(); if (!d) return null;
    return ["Fiscal", d.titulo + "."];
  });
  const el = document.createElement("section"); el.className = "panel lectura";
  el.innerHTML = `<h2>Lectura del último dato</h2><ul>${items.map(([a, b]) => `<li><span>${a}</span><div>${esc(b)}</div></li>`).join("")}</ul>
    <p class="nota">Esta lectura y los títulos de cada gráfico no están escritos a mano: son fórmulas que la página calcula con el último dato cada vez que se abre, así que cambian solos con cada actualización.</p>`;
  return el;
}

// ─────────────────────────── calendario ───────────────────────────
function calendario() {
  const hoy = hoyUTC();
  const ev = eventosAgenda(hoy - 7 * 864e5, hoy + 42 * 864e5);
  const box = document.createElement("div"); box.className = "cal";
  if (!ev.length) {
    box.innerHTML = `<section class="estado"><h2>El calendario se arma solo</h2><p>Con la próxima actualización automática aparecen acá las fechas de publicación de cada release que alimenta el monitor.</p></section>`;
    return box;
  }
  const lunes = t => { const d = new Date(t); const w = (d.getUTCDay() + 6) % 7; return t - w * 864e5; };
  const grupos = new Map();
  for (const c of ev) { const k = lunes(P(c.fecha)); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(c); }
  const intro = document.createElement("p"); intro.className = "nota";
  intro.textContent = "Próximas 6 semanas de publicaciones que alimentan este monitor, según el calendario oficial que publica FRED. \"Clave\" marca los datos que suelen mover el mercado. Los datos de mercado (tasas, dólar, GDPNow) se actualizan varias veces por semana y no figuran acá.";
  box.appendChild(intro);
  for (const [k, lista] of grupos) {
    const esta = hoy >= k && hoy < k + 7 * 864e5;
    const s = document.createElement("section"); s.className = "semana";
    s.innerHTML = `<h3>Semana del ${fd(k)}${esta ? '<span class="badge">Esta semana</span>' : ""}</h3>
      <ul class="agenda">${lista.map(c => {
        const t = P(c.fecha), dias = Math.round((t - hoy) / 864e5);
        const series = c.series.map(x => DATA.series[x] && DATA.series[x].n).filter(Boolean);
        return `<li class="${dias === 0 ? "hoy" : ""}${dias < 0 ? " pasado" : ""}"><div class="fch">${fd(t)}<small>${dias === 0 ? "Hoy" : dias < 0 ? "Publicado" : dias === 1 ? "Mañana" : `en ${dias} días`}</small></div>
          <div class="rel"><b>${esc(nombreRelease(c.nombre))}</b>${CLAVE.test(c.nombre) ? '<span class="clave">Clave</span>' : ""}<div class="chips">${series.slice(0, 6).map(n => `<span>${esc(n)}</span>`).join("")}${series.length > 6 ? `<span>y ${series.length - 6} más</span>` : ""}</div></div></li>`;
      }).join("")}</ul>`;
    box.appendChild(s);
  }
  return box;
}

// ─────────────────────────── render ───────────────────────────
function render() {
  limpiar();
  calcularRango();
  actualizarMeta();
  const main = document.getElementById("main");
  main.innerHTML = "";
  const tarjetas = [];
  const grilla = lista => { const gr = document.createElement("div"); gr.className = "grid"; for (const [id, cl] of lista) { const t = tarjeta(id, cl); gr.appendChild(t); tarjetas.push(t); } return gr; };
  if (SEC === "resumen") {
    main.appendChild(tiles());
    if (T1 === Infinity) main.appendChild(agendaResumen());
    main.appendChild(lectura());
    const h = document.createElement("h2"); h.className = "bloque"; h.textContent = "Las preguntas del ciclo"; main.appendChild(h);
    main.appendChild(grilla([["colchon", "ancha"], ["heat", "ancha alta"], ["capex"], ["politica"]]));
  } else if (SEC === "calendario") {
    main.appendChild(calendario());
  } else {
    main.appendChild(grilla(BLOQUES[SEC]));
  }
  // se dibuja en el próximo ciclo para que las tarjetas ya tengan su ancho final
  setTimeout(() => tarjetas.forEach(dibujar), 0);
}

function actualizarMeta() {
  const gen = new Date(DATA.generado);
  let h = `Actualizado el <b>${gen.getUTCDate()}-${MES[gen.getUTCMonth()]}-${gen.getUTCFullYear()}</b> · ${Object.keys(DATA.series).length} series de BEA, BLS, Fed y Tesoro`;
  if (T1 !== Infinity) h += ` · <span class="aviso">Viendo datos hasta ${fm(T1)}</span>`;
  document.getElementById("meta").innerHTML = h;
}

function irA(id) {
  SEC = id; history.replaceState(null, "", "#" + id);
  pestañas(); render(); window.scrollTo({ top: 0 });
}
function pestañas() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  for (const [id, n] of SECC) {
    const b = document.createElement("button");
    b.type = "button"; b.id = "tab-" + id; b.setAttribute("role", "tab"); b.textContent = n;
    b.setAttribute("aria-selected", String(id === SEC));
    b.addEventListener("click", () => irA(id));
    nav.appendChild(b);
  }
}

// ─────────────────────────── período ───────────────────────────
function marcarRango() {
  document.querySelectorAll("#rango button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.r === RANGO.modo)));
  const man = document.getElementById("manual");
  const abierto = RANGO.modo === "manual";
  man.hidden = !abierto;
  document.getElementById("r-manual").setAttribute("aria-expanded", String(abierto));
}
function guardarRango() { try { localStorage.setItem("umm-rango2", JSON.stringify(RANGO)); } catch (e) {} }
document.querySelectorAll("#rango button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.r === "manual") {
    RANGO.modo = "manual";
    const d = document.getElementById("m-desde"), h = document.getElementById("m-hasta");
    if (!d.value) d.value = RANGO.desde || "2019-01";
    if (!h.value) h.value = RANGO.hasta || h.max;
    marcarRango(); d.focus();
    return;
  }
  RANGO = { modo: b.dataset.r, desde: RANGO.desde, hasta: RANGO.hasta };
  marcarRango(); guardarRango();
  if (DATA) render();
}));
document.getElementById("manual").addEventListener("submit", e => {
  e.preventDefault();
  let d = document.getElementById("m-desde").value, h = document.getElementById("m-hasta").value;
  if (!d || !h) return;
  if (d > h) [d, h] = [h, d];
  RANGO = { modo: "manual", desde: d, hasta: h };
  document.getElementById("m-desde").value = d; document.getElementById("m-hasta").value = h;
  marcarRango(); guardarRango();
  if (DATA) render();
});

function iniciar(json) {
  DATA = json;
  DIARIOS = releasesDiarios();
  const fin = Object.values(DATA.series).map(s => s.d.length ? s.d[s.d.length - 1][0] : "").sort().pop();
  ULT = P(fin);
  const mx = fin.slice(0, 7);
  document.getElementById("m-desde").max = mx; document.getElementById("m-hasta").max = mx;
  try {
    const r = JSON.parse(localStorage.getItem("umm-rango2") || "null");
    if (r && r.modo) RANGO = r;
  } catch (e) {}
  if (RANGO.modo === "manual") { document.getElementById("m-desde").value = RANGO.desde; document.getElementById("m-hasta").value = RANGO.hasta; }
  marcarRango();
  const h = location.hash.replace("#", "");
  if (SECC.some(([id]) => id === h)) SEC = h;
  pestañas(); render();
}

window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "");
  if (DATA && h !== SEC && SECC.some(([id]) => id === h)) { SEC = h; pestañas(); render(); }
});
let tRes;
window.addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(() => { if (DATA) render(); if (MODAL) MODAL.resize(); }, 200); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => DATA && render());
new MutationObserver(() => DATA && render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

if (typeof echarts === "undefined") {
  document.getElementById("main").innerHTML = `<section class="estado"><h2>No cargó la librería de gráficos</h2><p>Recargá la página. Si sigue, avisame: el archivo vendor/echarts-5.5.1.min.js no se está publicando.</p></section>`;
} else {
  fetch("data.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(iniciar)
    .catch(e => {
      console.error(e);
      document.getElementById("meta").textContent = "Sin datos todavía";
      document.getElementById("main").innerHTML = `<section class="estado"><h2>Todavía no hay datos</h2>
        <p>La primera actualización automática todavía no corrió. En el repo, pestaña Actions → "Actualizar datos" → Run workflow. En un par de minutos esta página se llena sola.</p></section>`;
    });
}
</script>
