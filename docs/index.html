<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Macro Monitor</title>
<meta name="description" content="Monitor de la economía de EE.UU. con datos de BEA, BLS, Fed y Tesoro, actualizado automáticamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Cabecera con vigía y período → pestañas → cada sección abre con síntesis e indicadores y sigue con gráficos.
   Tablero, Calendario y Explorador son vistas propias. */
:root {
  color-scheme: light;
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f6f7fa; --ink: #111722; --ink-2: #465063; --muted: #6f7a8c;
  --grid: #e5e8ee; --axis: #c5cbd5; --line: rgba(17, 23, 34, 0.10); --band: rgba(42, 120, 214, 0.08);
  --hover: rgba(17, 23, 34, 0.04); --scrim: rgba(12, 16, 24, 0.55); --hoy: #fff4d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --ref: #52514e;
  --ok: #0c8a0c; --alerta: #b87400; --error: #c43a3a;
  --div-lo: #2a78d6; --div-mid: #f0efec; --div-hi: #e34948;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1117; --surface: #161b24; --surface-2: #1b212c; --ink: #eef1f6; --ink-2: #b6bfcc; --muted: #8791a2;
    --grid: #252c38; --axis: #353e4c; --line: rgba(255,255,255,0.09); --band: rgba(57,135,229,0.12);
    --hover: rgba(255,255,255,0.05); --scrim: rgba(0,0,0,0.65); --hoy: #3a3220;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --ref: #c3c2b7;
    --ok: #2fb35a; --alerta: #e0a030; --error: #e66767;
    --div-lo: #3987e5; --div-mid: #383835; --div-hi: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1117; --surface: #161b24; --surface-2: #1b212c; --ink: #eef1f6; --ink-2: #b6bfcc; --muted: #8791a2;
  --grid: #252c38; --axis: #353e4c; --line: rgba(255,255,255,0.09); --band: rgba(57,135,229,0.12);
  --hover: rgba(255,255,255,0.05); --scrim: rgba(0,0,0,0.65); --hoy: #3a3220;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --ref: #c3c2b7;
  --ok: #2fb35a; --alerta: #e0a030; --error: #e66767;
  --div-lo: #3987e5; --div-mid: #383835; --div-hi: #e66767;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body.bloqueado { overflow: hidden; }
.wrap { max-width: 1340px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 20px 48px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Cabecera */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; padding-block: 8px 18px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.brand .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 4px; }
.brand p { margin: 0; color: var(--muted); font-size: 13.5px; }
.brand p b { color: var(--ink-2); font-weight: 500; }
.brand p .aviso { color: var(--s2); font-weight: 500; }
.vigia { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px 3px 9px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.vigia[hidden] { display: none; }
.vigia:hover { background: var(--hover); }
.vigia i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.vigia.alerta i { background: var(--alerta); }
.vigia.error i { background: var(--error); }
.periodo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.periodo > span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 13px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:not([aria-pressed="true"]):hover { background: var(--hover); }
.manual[hidden] { display: none; }
.manual { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); width: 100%; justify-content: flex-end; }
.manual label { display: inline-flex; align-items: center; gap: 6px; }
.manual input { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 5px 8px; font-size: 13.5px; }
.manual button { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 6px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }

/* Pestañas */
.tabs { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; padding-block: 10px; margin-bottom: 6px; scrollbar-width: none; border-bottom: 1px solid transparent; }
.tabs.con-sombra { border-bottom-color: var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: none; padding: 8px 14px; border-radius: 8px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.tabs button:hover { background: var(--hover); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.tabs .sep { width: 1px; background: var(--line); margin: 6px 6px; flex: none; }

/* Indicadores */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px 11px; display: grid; gap: 3px; min-width: 0; align-content: start; }
.tile.clic { cursor: pointer; }
.tile.clic:hover { border-color: var(--axis); }
.tile .lab { font-size: 13px; color: var(--ink-2); font-weight: 500; display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
.tile .val { font-size: 27px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; }
.tile .val small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile .del { font-size: 12.5px; color: var(--muted); }
.tile .cmb { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-height: 1.5em; }
.tile svg { display: block; width: 100%; height: 32px; margin-top: 3px; }
.nuevo { font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #fff; background: var(--s2); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.pctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pctl i { position: relative; display: block; height: 4px; border-radius: 2px; background: var(--grid); }
.pctl i b { position: absolute; top: -3px; width: 2px; height: 10px; border-radius: 1px; background: var(--ink-2); }

/* Cabecera de sección */
.cabecera { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 8px; display: grid; gap: 14px; }
.cabecera h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.cabecera p { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); max-width: 120ch; }
.cabecera .tiles { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; }
.cabecera .tile { background: var(--surface-2); border-color: transparent; padding: 11px 13px 10px; }
.cabecera .tile.clic:hover { border-color: var(--axis); }
.cabecera .tile .val { font-size: 23px; }

.dupla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; min-width: 0; }
.panel h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel h2 button { border: 0; background: none; color: var(--s1); font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; }
.lectura ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.lectura li { display: grid; grid-template-columns: 104px 1fr; gap: 12px; font-size: 15px; color: var(--ink); max-width: 118ch; }
.lectura li span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 3px; }
.nota { margin: 12px 0 0; font-size: 13px; color: var(--muted); max-width: 118ch; }
.lista { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.lista li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 7px 8px; border-radius: 6px; font-size: 14px; }
.lista li.hoy { background: var(--hoy); }
.lista .fch { color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.lista .fch small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.lista .rel b { font-weight: 500; }
.lista .rel .det { display: block; color: var(--muted); font-size: 12.5px; }
.vacio-txt { color: var(--muted); font-size: 14px; margin: 4px 0; }
h2.bloque { margin: 26px 0 12px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.clave { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--s2); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }

/* Tarjetas de gráfico */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 12px; display: flex; flex-direction: column; min-width: 0; }
.card.ancha { grid-column: 1 / -1; }
.card h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.card .sub { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.card .chart { height: 320px; margin-top: 6px; }
.card.ancha .chart { height: 370px; }
.card.alta .chart { height: 470px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.leyenda:empty { display: none; }
.leyenda button { border: 0; background: none; padding: 1px 0; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink-2); font-size: 13px; text-align: left; }
.leyenda button[aria-pressed="false"] { opacity: 0.4; }
.leyenda span.fija { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.leyenda b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sw { flex: none; display: inline-block; width: 16px; height: 0; border-top: 2.5px solid currentColor; border-radius: 2px; }
.sw.barra { height: 10px; border: 0; background: currentColor; border-radius: 2px; width: 10px; }
.sw.area { height: 10px; border: 0; background: currentColor; opacity: 0.55; border-radius: 2px; width: 12px; }
.sw.punteada { border-top-style: dashed; }
.sw.ref { border-top: 1.5px dashed var(--ref); }
.sw.banda { height: 10px; width: 14px; border: 0; background: var(--band); outline: 1px solid var(--line); }
.card footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.card footer .meta { display: grid; gap: 1px; min-width: 0; }
.acciones { display: flex; gap: 6px; flex-wrap: wrap; }
.acciones button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.acciones button:hover { background: var(--hover); }
.acciones svg { width: 13px; height: 13px; }
.tabla { margin-top: 10px; max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.tabla table, .tablero table, .estado-tabla table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.tabla th, .tabla td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
.tabla th:first-child, .tabla td:first-child { text-align: left; }
.tabla thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 500; }

/* Tablero */
.filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
.filtros button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.filtros .ayuda { font-size: 12.5px; color: var(--muted); margin-left: auto; }
.tablero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.tablero table { font-size: 13.5px; min-width: 1000px; }
.tablero th, .tablero td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
.tablero th:first-child, .tablero td:first-child { text-align: left; }
.tablero thead th { background: var(--surface); color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; user-select: none; }
.tablero thead th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
.tablero thead th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
.tablero tr.grupo td { background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 10px; }
.tablero tbody tr.fila { cursor: pointer; }
.tablero tbody tr.fila:hover td { background: var(--hover); }
.tablero td.nom b { font-weight: 500; }
.tablero td.nom small { display: block; color: var(--muted); font-size: 12px; }
.tablero td.val { font-weight: 600; font-size: 14.5px; }
.tablero td svg { width: 110px; height: 26px; display: block; margin-left: auto; }
.tablero .barra-p { display: inline-flex; align-items: center; gap: 8px; }
.tablero .barra-p i { position: relative; display: inline-block; width: 60px; height: 4px; background: var(--grid); border-radius: 2px; }
.tablero .barra-p i b { position: absolute; top: -3px; width: 2px; height: 10px; background: var(--ink-2); border-radius: 1px; }

/* Calendario */
.cal-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.cal-nav h2 { margin: 0; font-size: 18px; font-weight: 600; flex: 1 1 auto; }
.cal-nav .seg button { padding: 6px 12px; }
.semana-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.dia { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; display: flex; flex-direction: column; }
.dia.hoy { border-color: var(--s4); box-shadow: 0 0 0 1px var(--s4); }
.dia header { padding: 10px 14px 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dia header b { font-size: 14px; font-weight: 600; text-transform: capitalize; }
.dia header span { font-size: 12px; color: var(--muted); }
.dia header .etiq-hoy { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); background: var(--hoy); padding: 0 6px; border-radius: 4px; }
.dia .eventos { padding: 8px; display: grid; gap: 8px; align-content: start; flex: 1; }
.evento { border: 1px solid var(--line); border-left: 3px solid var(--axis); border-radius: 8px; padding: 8px 10px; background: var(--surface); display: grid; gap: 3px; }
.evento.es-clave { border-left-color: var(--s2); }
.evento .hora { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.evento .hora .ok { color: var(--ok); font-weight: 600; }
.evento b { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.evento .res { font-size: 12.5px; color: var(--ink-2); display: grid; gap: 1px; }
.evento .res span b { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink); }
.evento .res small { color: var(--muted); }
.dia .nada { color: var(--muted); font-size: 12.5px; padding: 6px 6px; }
.cal-pie { margin-top: 12px; font-size: 12.5px; color: var(--muted); max-width: 118ch; }

/* Explorador */
.explorador { display: grid; gap: 16px; }
.selector { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
.selector .filas { display: grid; gap: 8px; }
.selector .fila { display: grid; grid-template-columns: 14px minmax(0, 2.2fr) minmax(0, 1.3fr) auto; gap: 10px; align-items: center; }
.selector .fila i { width: 12px; height: 12px; border-radius: 3px; }
.selector select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 6px 8px; font-size: 13.5px; min-width: 0; width: 100%; }
.selector .quitar { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.selector .botones { display: flex; gap: 8px; flex-wrap: wrap; }
.selector .botones button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }

/* Ventana ampliada */
.modal { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: clamp(8px, 3vw, 32px); }
.modal[hidden] { display: none !important; }
.dialogo { background: var(--surface); border-radius: 12px; width: min(1400px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; padding: 20px 22px 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); min-width: 0; }
.dialogo header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.dialogo h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.dialogo .sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.dialogo .chart { height: min(64vh, 700px); margin-top: 8px; }
.dialogo .chart[hidden], .dialogo footer[hidden] { display: none; }
.dialogo footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.cerrar { border: 1px solid var(--line); background: none; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; flex: none; display: grid; place-items: center; }
.cerrar:hover { background: var(--hover); }
.estado-tabla { margin-top: 12px; max-height: 60vh; overflow: auto; }
.estado-tabla th, .estado-tabla td { padding: 6px 10px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
.estado-tabla thead th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 500; font-size: 12px; }
.punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
.punto.alerta { background: var(--alerta); } .punto.error { background: var(--error); }

.estado { margin-top: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; max-width: 640px; }
.estado h2 { margin: 0 0 8px; font-size: 18px; }
.estado p { margin: 0; color: var(--ink-2); }
.pie { margin-top: 36px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } .semana-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .grid, .dupla { grid-template-columns: minmax(0, 1fr); }
  .card .chart { height: 300px; }
  .card.alta .chart { height: 520px; }
  .semana-grid { grid-template-columns: minmax(0, 1fr); }
  .dia .nada { padding: 2px 6px; }
}
@media (max-width: 560px) {
  .brand h1 { font-size: 22px; }

// ═════════════════════════ utilidades ═════════════════════════

const fd = t => { const d = new Date(t); return `${DIA[d.getUTCDay()]} ${String(d.getUTCDate()).padStart(2, "0")}-${MES[d.getUTCMonth()]}`; };
const T = (y, m = 1) => Date.UTC(y, m - 1, 1);
const P = s => Date.parse(s + "T00:00:00Z");
const DIA_MS = 864e5;
const hoyUTC = () => { const h = new Date(); return Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const unidadTxt = u => u === "%" ? "%" : u ? " " + u : "";

function calcularRango() {
  const d = new Date(ULT === Infinity ? Date.now() : ULT);
  const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1;
  T1 = Infinity;
  if (RANGO.modo === "2022") T0 = T(2022);
  else if (RANGO.modo === "2000") T0 = T(2000);
  else if (RANGO.modo === "manual" && RANGO.desde) {
    const [y0, m0] = RANGO.desde.split("-").map(Number), [y1, m1] = RANGO.hasta.split("-").map(Number);
    T0 = T(y0, m0);
    T1 = T(y1, m1) >= T(y, m) ? Infinity : Date.UTC(y1, m1, 0);
  } else if (RANGO.modo === "manual") T0 = T(2022);
  else T0 = T(y - Number(RANGO.modo), m);
}

// Serie con datos hasta el fin del período (si el período termina antes de hoy, todo se calcula "a esa fecha")
function S(k) {
  const s = DATA && DATA.series[k];
  if (!s) return null;
  const a = s.d.map(([d, v]) => [P(d), v]).filter(p => p[0] <= T1);
  return a.length ? a : null;
}
const last = a => a && a.length ? a[a.length - 1] : null;
const prev = (a, n = 1) => a && a.length > n ? a[a.length - 1 - n] : null;
function lagged(a, k, fn) {
  if (!a) return null;
  const out = [];
  for (let i = k; i < a.length; i++) if (a[i - k][1]) out.push([a[i][0], fn(a[i][1], a[i - k][1])]);
  return out.length ? out : null;
}
const yoy = (a, k = 12) => lagged(a, k, (x, y) => (x / y - 1) * 100);
const ann = (a, k, per = 12) => lagged(a, k, (x, y) => (Math.pow(x / y, per / k) - 1) * 100);
const pct = (a, k = 1) => lagged(a, k, (x, y) => (x / y - 1) * 100);
const diff = (a, k = 1) => lagged(a, k, (x, y) => x - y);
const escala = (a, f) => a ? a.map(p => [p[0], p[1] * f]) : null;
function roll(a, w, suma = false) {
  if (!a || a.length < w) return null;
  const out = [];
  for (let i = w - 1; i < a.length; i++) {
    let s = 0; for (let j = i - w + 1; j <= i; j++) s += a[j][1];
    out.push([a[i][0], suma ? s : s / w]);

  return out;
}
function join(a, b, fn) {
  if (!a || !b) return null;
  const m = new Map(b); const r = a.filter(p => m.has(p[0])).map(p => [p[0], fn(p[1], m.get(p[0]))]);
  return r.length ? r : null;
}
function joinQ(m, q, fn) {
  if (!m || !q) return null;
  const mq = new Map(q);
  const r = m.map(([t, v]) => { const d = new Date(t); const k = Date.UTC(d.getUTCFullYear(), Math.floor(d.getUTCMonth() / 3) * 3, 1); return mq.has(k) ? [t, fn(v, mq.get(k))] : null; }).filter(Boolean);
  return r.length ? r : null;
}
function toQ(a) {
  if (!a) return null;
  const g = new Map();
  for (const [t, v] of a) {
    const d = new Date(t), k = Date.UTC(d.getUTCFullYear(), Math.floor(d.getUTCMonth() / 3) * 3, 1);
    if (!g.has(k)) g.set(k, []); g.get(k).push(v);

  return [...g].filter(([, v]) => v.length === 3).map(([k, v]) => [k, v.reduce((x, y) => x + y, 0) / 3]);
}

  if (as.some(a => !a || !a.length)) return as.map(() => null);
  const inicio = Math.max(T0, ...as.map(a => a[0][0]));
  return as.map(a => { const b = a.filter(p => p[0] >= inicio); return b.length ? b.map(p => [p[0], p[1] / b[0][1] * 100]) : null; });
}
const cut = (a, desde = T0) => a ? a.filter(p => p[0] >= desde) : null;
function rangoNormal(a) {
  if (!a) return null;
  const r = a.filter(p => p[0] >= T(2000) && p[0] < T(2020)).map(p => p[1]).sort((x, y) => x - y);
  if (r.length < 12) return null;

}

}

const nombreRelease = n => RELEASES_ES[n] || n;

function hoyYaSalio() {

}
const publicado = f => P(f) < hoyUTC() || (P(f) === hoyUTC() && hoyYaSalio());
function proximoRelease(ks) {
  const rids = new Set(ks.map(k => DATA.series[k] && DATA.series[k].rel).filter(Boolean));
  if (!rids.size) return null;
  if ([...rids].every(r => DIARIOS.has(r))) return { diario: true };
  const e = (DATA.calendario || []).filter(c => rids.has(c.rid) && !DIARIOS.has(c.rid) && !publicado(c.fecha))

function paleta() { return [css("--s1"), css("--s2"), css("--s3"), css("--s4")]; }
function redondo(v, paso, arriba) { return (arriba ? Math.ceil(v / paso) : Math.floor(v / paso)) * paso; }
function pasoLindo(r) { const e = Math.pow(10, Math.floor(Math.log10(r))); const f = r / e; return (f <= 2 ? 0.25 : f <= 5 ? 0.5 : 1) * e; }
function recorteCovid(sp) {
  if (sp.tipo || sp.yMin != null || sp.yMax != null || sp.sinRecorte || sp._rc) return;
  sp._rc = true;
  const pts = sp.series.flatMap(s => s.d);
  if (!pts.some(p => p[0] >= COVID_SHOCK[0] && p[0] <= COVID_SHOCK[1])) return;
  const fuera = pts.filter(p => p[0] < COVID[0] || p[0] > COVID[1]).map(p => p[1]);
  if (fuera.length < 6) return;
  const todos = pts.map(p => p[1]);
  const lo = Math.min(...fuera), hi = Math.max(...fuera), r = hi - lo || 1;
  const mn = Math.min(...todos), mx = Math.max(...todos);
  if (mx - hi > 0.4 * r || lo - mn > 0.4 * r) {
    const paso = pasoLindo(r * 1.25);
    if (mn < lo - 0.4 * r) sp.yMin = redondo(lo - 0.08 * r, paso, false);
    if (mx > hi + 0.4 * r) sp.yMax = redondo(hi + 0.08 * r, paso, true);

    if (s.t === "bar") { series.push(Object.assign(base, { type: "bar", stack: s.stack, barMaxWidth: 24, itemStyle: { color: c, borderRadius: [2, 2, 0, 0] } })); return; }

function lineasLectura() {
  const L = {};
  const intento = (k, f) => { try { const r = f(); if (r) L[k] = r; } catch (e) {} };
  intento("actividad", () => {
    const g = S("gdp_growth"), n = S("gdpnow"), ks = [["c_consumo", "el consumo"], ["c_inversion", "la inversión"], ["c_gobierno", "el gasto público"], ["c_externo", "el sector externo"]];
    const m = ks.map(([k, nm]) => [nm, last(S(k))[1]]).sort((a, b) => b[1] - a[1])[0];
    let t = `El PBI creció ${nf(last(g)[1])}% anualizado en ${fq(last(g)[0])}; lo que más aportó fue ${m[0]} (${sg(m[1])} pp).`;
    if (n && last(n)[0] > last(g)[0]) t += ` Para ${fq(last(n)[0])}, GDPNow estima ${nf(last(n)[1])}%.`;
    return t;
  });
  intento("consumidor", () => {
    const c = yoy(S("pce_real")), i = yoy(S("dpi_real")), s = last(S("saving_rate"))[1];
    return `El consumo real crece ${nf(last(c)[1])}% interanual contra ${nf(last(i)[1])}% del ingreso disponible real; la tasa de ahorro está en ${nf(s)}%.`;
  });
  intento("precios", () => {
    const c = S("pce_core"), y = last(yoy(c))[1], m3 = last(ann(c, 3))[1];
    const rs = rubros(), cal = rs.filter(r => last(r.a3)[1] > 3).length, e = S("infl_exp_5y5y");
    return `El core PCE corre a ${nf(y)}% interanual y ${nf(m3)}% anualizado a 3 meses` + (rs.length ? `; ${cal} de ${rs.length} rubros superan 3%` : "") + (e ? `. El mercado espera ${nf(last(e)[1], 2)}% a largo plazo.` : ".");
  });
  intento("empleo", () => {
    const p = roll(diff(S("payrolls")), 3), u = last(S("unemployment"))[1], sh = S("sahm");
    return `La economía suma ${nf(last(p)[1], 0)} mil puestos por mes en promedio de 3 meses, con desempleo en ${nf(u)}%` + (sh ? ` y la regla de Sahm en ${nf(last(sh)[1], 2)} pp (umbral 0,5).` : ".");
  });
  intento("tasas", () => {
    const r = S("tips10"), v = last(r)[1], f = last(S("fed_funds"))[1], c = last(yoy(S("pce_core")))[1];
    return `La tasa real a 10 años está en ${nf(v, 2)}% (percentil ${pctl(r, v)} desde 2003) y la tasa real de la Fed en ${nf(f - c)}%.`;
  });
  intento("externo", () => {
    const d = G.deficit(), b = G.balanza(); if (!d) return null;
    return d.titulo + "." + (b ? ` ${b.titulo}.` : "");
  });
  return L;
}

function limpiar() { while (CHARTS.length) CHARTS.pop().dispose(); }
function frescura(sp) {
  const k = (sp.ks || []).find(k => DATA.series[k]);
  if (!k) return "";
  const s = S(k), f = DATA.series[k].f, u = s ? last(s)[0] : null;
  let txt = u ? `Último dato: ${f === "Q" ? fq(u) : fm(u)}` : "";
  const pr = T1 === Infinity ? proximoRelease(sp.ks) : null;
  if (pr && pr.diario) txt += " · dato de alta frecuencia";
  else if (pr) txt += ` · próximo: ${fd(pr.fecha)}`;
  return txt;
}
function tarjeta(id, clase) {
  let sp = null;
  try { sp = G[id](); } catch (e) { console.error(id, e); }
  const el = document.createElement("article");
  el.className = "card " + (clase || "");
  if (!sp || (sp.tipo !== "heat" && !sp.series.some(s => s.d && s.d.length))) {
    el.innerHTML = `<h3>Sin datos para este gráfico</h3><p class="sub">Falta alguna de sus series en el período elegido o en la última actualización.</p>`;
    return el;
  }
  recorteCovid(sp);
  el.innerHTML = `<h3></h3><p class="sub"></p><div class="chart" role="img"></div>
    <footer><div class="meta"><span class="fte"></span><span class="frs"></span></div>
    <div class="acciones"><button type="button" class="b-tabla" aria-expanded="false">Tabla</button>
      <button type="button" class="b-png">${ICONOS.png}PNG</button><button type="button" class="b-ampliar">${ICONOS.ampliar}Ampliar</button></div></footer>
    <div class="tabla" hidden></div>`;
  el.querySelector("h3").textContent = sp.titulo;
  if (esNuevo(sp.ks || [])) el.querySelector("h3").insertAdjacentHTML("beforeend", ' <span class="nuevo" style="vertical-align:3px">Nuevo</span>');
  el.querySelector(".sub").textContent = sp.sub;
  el.querySelector(".sub").after(leyenda(sp, () => el._chart));
  el.querySelector(".chart").setAttribute("aria-label", sp.titulo);
  el.querySelector(".fte").textContent = "Fuente: " + (sp.fuente || "");
  el.querySelector(".frs").textContent = frescura(sp);
  const btn = el.querySelector(".b-tabla"), tb = el.querySelector(".tabla");
  btn.addEventListener("click", () => {
    const abrir = tb.hidden; tb.hidden = !abrir; btn.setAttribute("aria-expanded", String(abrir));
    btn.textContent = abrir ? "Ocultar tabla" : "Tabla";
    if (abrir && !tb.firstChild) tb.appendChild(tablaDe(sp));
  });
  el.querySelector(".b-ampliar").addEventListener("click", () => abrirModal(sp, id));
  el.querySelector(".b-png").addEventListener("click", () => bajarPNG(sp, el._chart, id));
  el._sp = sp;
  return el;
}
function tablaDe(sp) {
  const t = document.createElement("table");
  let cab, filas;
  if (sp.tabla) { cab = sp.tabla.cab; filas = sp.tabla.filas; }
  else if (sp.tipo === "cat") {
    cab = ["", ...sp.series.map(s => s.n)];
    filas = sp.cats.map((c, i) => [c, ...sp.series.map(s => nf(s.d[i], sp.dec ?? 1))]);
    if (sp.freq === "Q") filas.reverse();
  } else {
    const fx = sp.freq === "Q" ? fq : fm, dec = sp.dec ?? 1;
    const ts = [...new Set(sp.series.flatMap(s => s.d.map(p => p[0])))].sort((a, b) => b - a).slice(0, 48);
    const ms = sp.series.map(s => new Map(s.d));
    cab = [sp.freq === "Q" ? "Trimestre" : "Mes", ...sp.series.map(s => s.n)];
    filas = ts.map(t => [fx(t), ...ms.map(m => nf(m.get(t), dec))]);
  }
  t.innerHTML = "<thead><tr>" + cab.map(c => `<th scope="col">${esc(c)}</th>`).join("") + "</tr></thead><tbody>" +
    filas.map(f => "<tr>" + f.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>").join("") + "</tbody>";
  return t;
}
function dibujar(el) {
  const sp = el._sp; if (!sp) return;
  const box = el.querySelector(".chart");
  const ch = echarts.init(box, null, { renderer: "canvas" });
  ch.setOption(opciones(sp, box.clientWidth, false));
  el._chart = ch; CHARTS.push(ch);
}

function envolverTexto(ctx, texto, ancho) {
  const pal = texto.split(" "), lin = []; let l = "";
  for (const p of pal) { const t = l ? l + " " + p : p; if (ctx.measureText(t).width > ancho && l) { lin.push(l); l = p; } else l = t; }
  if (l) lin.push(l);
  return lin;
}
// Imagen lista para publicar: título, subtítulo, leyenda con valores, gráfico, fuente y firma
function bajarPNG(sp, chart, id) {
  if (!chart) return;
  const k = 2, pad = 28 * k, fnt = css("--font");
  const img = new Image();
  img.onload = () => {

// ═════════════════════════ vigía de datos ═════════════════════════
function diasHabilesDesde(t) {
  let n = 0; const h = hoyUTC();
  for (let d = t + DIA_MS; d <= h; d += DIA_MS) { const w = new Date(d).getUTCDay(); if (w !== 0 && w !== 6) n++; }
  return n;
}
function vigia() {
  const hoy = hoyUTC(), items = [];
  const gen = new Date(DATA.generado), genDia = Date.UTC(gen.getUTCFullYear(), gen.getUTCMonth(), gen.getUTCDate());
  const edad = diasHabilesDesde(genDia);
  for (const [k, s] of Object.entries(DATA.series)) {
    if (!s.d.length) continue;
    const ult = P(s.d[s.d.length - 1][0]);
    const alta = s.rel && DIARIOS.has(s.rel);
    // mensual: el dato del mes m sale como tarde a fines de m+2; trimestral: dentro de los 5 meses siguientes
    const limite = s.f === "Q" ? 300 : alta ? 45 : 95;
    const dias = Math.round((hoy - ult) / DIA_MS);
    items.push({ n: s.n, org: orgDe(k), f: s.f, ult, ok: dias <= limite, motivo: dias > limite ? `sin datos nuevos hace ${dias} días` : "" });
  }
  const faltan = DATA.faltan || [];
  const malas = items.filter(i => !i.ok).length + faltan.length;
  const estado = edad > 2 ? "error" : malas ? "alerta" : "ok";
  const texto = estado === "error" ? `Sin actualizar hace ${edad} días hábiles` : estado === "alerta" ? `${malas} serie${malas > 1 ? "s" : ""} para revisar` : "Datos al día";
  return { estado, texto, items, faltan };
}

// Qué mostrar de cada release: el indicador principal y su valor anterior
function resultadoRelease(nombre) {
  const r = [];
  const add = (n, a, d, u = "%", signo = false) => { if (!a || !a.length) return; const v = last(a), p = prev(a); const f = x => (signo ? sg(x, d) : nf(x, d)) + unidadTxt(u); r.push({ n, v: f(v[1]), p: p ? f(p[1]) : null }); };
  try {
    if (/Debt to Gross/.test(nombre)) add("Deuda / PBI", S("debt_gdp"), 0);
    else if (/Employment Situation/.test(nombre)) { add("Nóminas", diff(S("payrolls")), 0, "mil", true); add("Desempleo", S("unemployment"), 1); }
    else if (/Consumer Price Index/.test(nombre)) { add("CPI core m/m", pct(S("cpi_core")), 1, "%", true); add("a/a", yoy(S("cpi_core")), 1); }
    else if (/Personal Income/.test(nombre)) { add("PCE core m/m", pct(S("pce_core")), 1, "%", true); add("a/a", yoy(S("pce_core")), 1); }
    else if (/^Gross Domestic Product$/.test(nombre)) add("PBI real", S("gdp_growth"), 1, "%");
    else if (/Retail/.test(nombre)) add("Ventas m/m", pct(S("retail")), 1, "%", true);
    else if (/Job Openings/.test(nombre)) add("Vacantes", escala(S("openings"), 1 / 1000), 2, "M");
    else if (/Weekly Claims/.test(nombre)) add("Pedidos, prom. del mes", escala(S("claims"), 1 / 1000), 0, "mil");
    else if (/Surveys of Consumers/.test(nombre)) { add("Confianza", S("sentiment"), 1, ""); add("Infl. esperada", S("infl_exp_1y"), 1); }
    else if (/G\.17/.test(nombre)) add("Producción m/m", pct(S("indpro")), 1, "%", true);
    else if (/Residential Construction/.test(nombre)) add("Inicios", S("housing_starts"), 0, "mil");
    else if (/\(M3\)/.test(nombre)) add("Órdenes de capital m/m", pct(S("core_orders")), 1, "%", true);
    else if (/International Trade/.test(nombre)) add("Balanza", escala(S("trade_balance"), 1 / 1000), 1, "mil M");
    else if (/Monthly Treasury/.test(nombre)) add("Resultado del mes", escala(S("deficit"), 1 / 1000), 0, "mil M");
    else if (/Sahm/.test(nombre)) add("Sahm", S("sahm"), 2, "pp");
    else if (/Debt to Gross/.test(nombre)) add("Deuda / PBI", S("debt_gdp"), 0);
  } catch (e) {}
  return r;
}

function grupoSerie(k) {
  if (k.startsWith("cat:")) return "Precios: rubros del core";
  const g = [["actividad", /^(gdp|gdi|c_|profits|inv_|indpro|retail|core_orders|housing|final_sales)/], ["consumidor", /^(dpi|pce_real|saving|pce_dur|pce_ndur|pce_serv$|comp|transfers|sentiment)/],
    ["precios", /^(pce_|cpi|infl_)/], ["empleo", /^(payrolls|unemploy|ahe|epop|participation|openings|quits|claims|cont_|sahm)/], ["tasas", /^(fed_|ust|tips|breakeven|term_|spread|mortgage)/], ["externo", /^(dollar|trade|imp_|deficit|interest|debt)/]];
  const m = g.find(([, re]) => re.test(k)); return m ? FRENTES[m[0]] : "Otras";
}
function aplicarTransf(k, tr) {
  const s = S(k); if (!s) return null;
  const q = DATA.series[k].f === "Q";
  if (tr === "yoy") return yoy(s, q ? 4 : 12);
  if (tr === "ann3") return q ? ann(s, 1, 4) : ann(s, 3);
  if (tr === "pct") return pct(s);
  if (tr === "dif") return diff(s);
  if (tr === "idx") return idxComun(s)[0];
  return s;
}
function leerExplora() {
  const h = decodeURIComponent(location.hash.replace("#", ""));
  if (!h.startsWith("explorador/")) return;
  const e = h.slice(11).split(",").map(x => { const i = x.lastIndexOf(":"); return [x.slice(0, i), x.slice(i + 1)]; })
    .filter(([k, t]) => DATA.series[k] && TRANSF.some(([id]) => id === t)).slice(0, 4).map(([k, t]) => ({ k, t }));
  if (e.length) EXPLORA = e;
}
function guardarExplora() { history.replaceState(null, "", "#explorador/" + EXPLORA.map(e => `${e.k}:${e.t}`).join(",")); }
function vistaExplorador(main, tarjetas) {
  if (!EXPLORA.length) EXPLORA = [{ k: "pce_core", t: "yoy" }, { k: "cpi_core", t: "yoy" }];
  const col = paleta();
  const claves = Object.keys(DATA.series).sort((a, b) => grupoSerie(a).localeCompare(grupoSerie(b)) || DATA.series[a].n.localeCompare(DATA.series[b].n));
  const grupos = [...new Set(claves.map(grupoSerie))];
  const opcionesSerie = sel => grupos.map(g => `<optgroup label="${esc(g)}">${claves.filter(k => grupoSerie(k) === g).map(k => `<option value="${esc(k)}" ${k === sel ? "selected" : ""}>${esc(DATA.series[k].n)}</option>`).join("")}</optgroup>`).join("");
  const selector = document.createElement("section"); selector.className = "selector";
  selector.innerHTML = `<div><h2 style="margin:0;font-size:18px">Explorador de series</h2><p class="nota" style="margin-top:2px">Elegí hasta 4 de las ${claves.length} series del monitor y cómo mostrarlas. El período es el de la cabecera; la dirección de la página guarda la combinación para compartirla.</p></div>
    <div class="filas">${EXPLORA.map((e, i) => `<div class="fila"><i style="background:${col[i]}"></i>
      <select data-i="${i}" data-campo="k" aria-label="Serie ${i + 1}">${opcionesSerie(e.k)}</select>
      <select data-i="${i}" data-campo="t" aria-label="Transformación ${i + 1}">${TRANSF.map(([id, n]) => `<option value="${id}" ${id === e.t ? "selected" : ""}>${n}</option>`).join("")}</select>
      <button type="button" class="quitar" data-i="${i}" ${EXPLORA.length === 1 ? "disabled" : ""}>Quitar</button></div>`).join("")}</div>
    <div class="botones">${EXPLORA.length < 4 ? '<button type="button" class="agregar">Agregar serie</button>' : ""}<button type="button" class="copiar">Copiar enlace</button></div>`;
  selector.querySelectorAll("select").forEach(s => s.addEventListener("change", () => { EXPLORA[Number(s.dataset.i)][s.dataset.campo] = s.value; guardarExplora(); render(); }));
  selector.querySelectorAll(".quitar").forEach(b => b.addEventListener("click", () => { EXPLORA.splice(Number(b.dataset.i), 1); guardarExplora(); render(); }));
  const ag = selector.querySelector(".agregar"); if (ag) ag.addEventListener("click", () => { EXPLORA.push({ k: "ust10", t: "nivel" }); guardarExplora(); render(); });
  selector.querySelector(".copiar").addEventListener("click", e => {
    const b = e.currentTarget;
    navigator.clipboard.writeText(location.href).then(() => { b.textContent = "Enlace copiado"; }, () => { b.textContent = "No se pudo copiar: usá la barra de direcciones"; });
  });
  const box = document.createElement("div"); box.className = "explorador";
  box.appendChild(selector);
  const series = EXPLORA.map((e, i) => {
    const d = aplicarTransf(e.k, e.t); if (!d) return null;
    const tn = TRANSF.find(([id]) => id === e.t)[1].toLowerCase();
    return { n: `${DATA.series[e.k].n}${e.t === "nivel" ? "" : ", " + tn}`, d: cut(d), c: i, k: e.k, t: e.t };
  }).filter(s => s && s.d.length);
  const unidadDe = s => s.t === "idx" ? "índice" : ["yoy", "ann3", "pct"].includes(s.t) ? "%" : DATA.series[s.k].u;
  const unidades = [...new Set(series.map(unidadDe))];
  G.__explora = () => series.length ? { titulo: series.map(s => s.n).join(" vs "),
    sub: unidades.length > 1 ? `Atención: las series tienen unidades distintas (${unidades.join(", ")}) y comparten el mismo eje.` : `Unidad: ${unidades[0] || "–"}.`,
    ks: series.map(s => s.k), fuente: fuente(...series.map(s => s.k)), unidad: unidades.length === 1 && unidades[0] === "%" ? "%" : "", dec: 2, series } : null;
  const gr = document.createElement("div"); gr.className = "grid";
  const card = tarjeta("__explora", "ancha alta");
  gr.appendChild(card); box.appendChild(gr); main.appendChild(box);
  tarjetas.push(card);
}
G.__explora = () => null;

// ═════════════════════════ render y navegación ═════════════════════════
function render() {
  limpiar(); calcularRango(); actualizarMeta();
  const main = document.getElementById("main"); main.innerHTML = "";
  const tarjetas = [];
  if (SEC === "resumen") vistaResumen(main, tarjetas);
  else if (SEC === "tablero") vistaTablero(main);
  else if (SEC === "calendario") vistaCalendario(main);
  else if (SEC === "explorador") vistaExplorador(main, tarjetas);
  else vistaSeccion(main, tarjetas);
  setTimeout(() => tarjetas.forEach(dibujar), 0);
}
function actualizarMeta() {
  const gen = new Date(DATA.generado);
  let h = `Actualizado el <b>${gen.getUTCDate()}-${MES[gen.getUTCMonth()]}-${gen.getUTCFullYear()}</b> · ${Object.keys(DATA.series).length} series`;
  if (T1 !== Infinity) h += ` · <span class="aviso">Viendo datos hasta ${fm(T1)}</span>`;
  document.getElementById("meta").innerHTML = h;
}
function irA(id) {
  SEC = id;
  if (id === "explorador" && EXPLORA.length) guardarExplora(); else history.replaceState(null, "", "#" + id);
  pestañas(); render(); window.scrollTo({ top: 0 });
}
function pestañas() {
  const nav = document.getElementById("tabs"); nav.innerHTML = "";
  for (const [id, n] of SECC) {
    if (id === "|") { nav.insertAdjacentHTML("beforeend", '<span class="sep" aria-hidden="true"></span>'); continue; }
    const b = document.createElement("button");
    b.type = "button"; b.id = "tab-" + id; b.setAttribute("role", "tab"); b.textContent = n;
    b.setAttribute("aria-selected", String(id === SEC));
    b.addEventListener("click", () => irA(id));
    nav.appendChild(b);
  }
}
function seccionDelHash() {
  const h = decodeURIComponent(location.hash.replace("#", "")).split("/")[0];
  return SECC.some(([id]) => id === h) ? h : null;
}

// Período
function marcarRango() {
  document.querySelectorAll("#rango button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.r === RANGO.modo)));
  const abierto = RANGO.modo === "manual";
  document.getElementById("manual").hidden = !abierto;
  document.getElementById("r-manual").setAttribute("aria-expanded", String(abierto));
}
function guardarRango() { try { localStorage.setItem("umm-rango2", JSON.stringify(RANGO)); } catch (e) {} }
document.querySelectorAll("#rango button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.r === "manual") {
    RANGO.modo = "manual";
    const d = document.getElementById("m-desde"), h = document.getElementById("m-hasta");
    if (!d.value) d.value = RANGO.desde || "2019-01";
    if (!h.value) h.value = RANGO.hasta || h.max;
    marcarRango(); d.focus(); return;
  }
  RANGO = { modo: b.dataset.r, desde: RANGO.desde, hasta: RANGO.hasta };
  marcarRango(); guardarRango(); if (DATA) render();
}));
document.getElementById("manual").addEventListener("submit", e => {
  e.preventDefault();
  let d = document.getElementById("m-desde").value, h = document.getElementById("m-hasta").value;
  if (!d || !h) return;
  if (d > h) [d, h] = [h, d];
  RANGO = { modo: "manual", desde: d, hasta: h };
  document.getElementById("m-desde").value = d; document.getElementById("m-hasta").value = h;
  marcarRango(); guardarRango(); if (DATA) render();
});

function iniciar(json) {
  DATA = json;
  DIARIOS = releasesDiarios();
  const fin = Object.values(DATA.series).map(s => s.d.length ? s.d[s.d.length - 1][0] : "").sort().pop();
  ULT = P(fin);
  const mx = fin.slice(0, 7);
  document.getElementById("m-desde").max = mx; document.getElementById("m-hasta").max = mx;
  try { const r = JSON.parse(localStorage.getItem("umm-rango2") || "null"); if (r && r.modo) RANGO = r; } catch (e) {}
  if (RANGO.modo === "manual" && RANGO.desde) { document.getElementById("m-desde").value = RANGO.desde; document.getElementById("m-hasta").value = RANGO.hasta; }
  marcarRango();
  const s = seccionDelHash(); if (s) SEC = s;
  leerExplora();
  pintarVigia();
  pestañas(); render();
}

window.addEventListener("hashchange", () => {
  const s = seccionDelHash();
  if (DATA && s && s !== SEC) { SEC = s; leerExplora(); pestañas(); render(); }
});
window.addEventListener("scroll", () => document.getElementById("tabs").classList.toggle("con-sombra", window.scrollY > 120), { passive: true });
let tRes, anchoPrevio = window.innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => { if (MODAL) MODAL.resize(); if (DATA && Math.abs(window.innerWidth - anchoPrevio) > 40) { anchoPrevio = window.innerWidth; render(); } else CHARTS.forEach(c => c.resize()); }, 200);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => DATA && render());
new MutationObserver(() => DATA && render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

if (typeof echarts === "undefined") {
  document.getElementById("main").innerHTML = `<section class="estado"><h2>No cargó la librería de gráficos</h2><p>Recargá la página. Si sigue, el archivo vendor/echarts-5.5.1.min.js no se está publicando.</p></section>`;
} else {
  fetch("data.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(iniciar)
    .catch(e => {
      console.error(e);
      document.getElementById("meta").textContent = "Sin datos todavía";
      document.getElementById("main").innerHTML = `<section class="estado"><h2>Todavía no hay datos</h2><p>La primera actualización automática todavía no corrió. En el repo, pestaña Actions → "Actualizar datos" → Run workflow.</p></section>`;
    });
}
</script>
