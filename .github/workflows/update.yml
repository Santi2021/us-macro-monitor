name: Actualizar datos

# Los releases de BEA y BLS salen a las 8:30 (hora de Nueva York) = 12:30 UTC.
# Corre de lunes a viernes a las 13:10 UTC y a las 21:10 UTC (por si algo se publica tarde),
# a mano desde la pestaña Actions -> "Actualizar datos" -> Run workflow,
# y cada vez que se modifica el script de datos.
on:
  schedule:
    - cron: "10 13 * * 1-5"
    - cron: "10 21 * * 1-5"
  workflow_dispatch:
  # también corre cuando cambia el script o el workflow, para que los cambios se vean en el momento
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Bajar FRED, BEA y BLS
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Guardar si hay datos nuevos
        run: |
          git config user.name "us-macro-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
